[project]
name = "hoichoi-drishti-api"
version = "0.1.0"
description = "FastAPI service for the Hoichoi Drishti semantic timeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlmodel>=0.0.24,<1",
  "psycopg2-binary>=2.9,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "regex>=2024.11.6",
  "srt>=3.5,<4",
  "numpy>=1.26",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5,<1",
  "boto3>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
media = ["Pillow>=11,<13"]
providers = ["openai>=1.75,<3", "sarvamai>=0.1,<2"]
# Local models (GPU recommended): shots, VAD, audio events, SigLIP frame embeddings.
gpu = ["scenedetect[opencv]>=0.6.4", "silero-vad>=5.1", "panns-inference>=0.1.1", "torch>=2.2", "transformers>=4.44", "sentencepiece>=0.2,<1", "Pillow>=11,<13", "demucs>=4.0"]
# Free, CPU-friendly frame analysis: YOLOv8n objects/people, SigLIP zero-shot location/mood/brands, EasyOCR brand text.
vision = ["ultralytics>=8.3,<9", "easyocr>=1.7,<2", "torch>=2.2", "transformers>=4.44", "sentencepiece>=0.2,<1", "Pillow>=11,<13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pipeline*"]
exclude = ["tests*", "snapshot_failures*"]

[tool.setuptools.package-data]
pipeline = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
